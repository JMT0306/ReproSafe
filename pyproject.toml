[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reprosafe"
version = "0.1.0"
description = "Privacy-safe diagnostic and bug-report preparation CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "João de Medeiros Terra"}]
dependencies = ["typer>=0.12", "rich>=13.7", "platformdirs>=4.2"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
ocr = ["Pillow>=10", "pytesseract>=0.3.10"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
reprosafe = "reprosafe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["reprosafe"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["F", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
