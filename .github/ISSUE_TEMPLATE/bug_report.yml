name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: markdown
    attributes:
      value: "Never paste real credentials or unsanitized private logs."
  - type: textarea
    id: description
    attributes: {label: Description}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
